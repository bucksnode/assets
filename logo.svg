      <stop stop-color="#d2f0fb"/>
      <stop offset="1" stop-color="#90d7f7"/>
    </linearGradient>
    <linearGradient id="front" x2="0" y2="1">
      <stop stop-color="#60c6fb"/>
      <stop offset="1" stop-color="#3baaf0"/>
    </linearGradient>
    <linearGradient id="antenna" x2="1" y2="0">
      <stop stop-color="#e2f7fc"/>
      <stop offset=".55" stop-color="#b5e9fb"/>
      <stop offset="1" stop-color="#70c7f4"/>
    </linearGradient>
    <linearGradient id="wifi" x2="0" y2="1">
      <stop stop-color="#d0efff"/>
      <stop offset="1" stop-color="#75c6fa"/>
    </linearGradient>
