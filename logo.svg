<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1540" viewBox="0 -33.33333333333333 480 513.3333333333333">
  <title>FREE wireless router logo</title>
  <desc>A blue wireless router at its original width, with bold white FREE lettering aligned to the front plane. All four dollar bills are enlarged uniformly to 126.5 percent around their own centers, including their dollar symbols and details, an additional 10 percent beyond the previous 115 percent size. The upper-left bill is moved 100 pixels left in total. The separate Free Cash headline and domain badge are removed. Only the right antenna remains. The router retains its lowered position. The former upper coin and its nearby star are relocated together to the open area left of the router. The former upper-left star sits in the yellow area above that coin. The lower-left bill is shifted 70 pixels right in total, and the lower-right bill remains raised. The entire floating Wi-Fi symbol retains its 70 percent scale and its center 250 pixels below its former position. Its perspective shear matches the router front edge, descending 22 units per 166 horizontal units. It remains in the frontmost layer, above the router and antenna. The pale-yellow backdrop at 85 percent opacity is unchanged. The exterior is transparent.</desc>
